# Corre el modelo en la nube y publica el reporte como pagina web (tambien se ve en el celular).
# Se ejecuta cada 3 h domingo, lunes y jueves (dias de partido), una vez al dia el resto, o a mano: pestaña Actions > "Reporte NFL" > Run workflow.
name: Reporte NFL

on:
  schedule:
    - cron: "17 */3 * * 0,1,4"     # domingo, lunes y jueves (dias de partido): cada 3 horas
    - cron: "17 15 * * 2,3,5,6"    # martes, miercoles, viernes y sabado: una vez al dia (9:17 am CDMX)
  workflow_dispatch:

permissions:
  contents: write      # guardar la base de datos en la rama "datos"
  pages: write         # publicar la pagina
  id-token: write

concurrency:
  group: reporte-nfl
  cancel-in-progress: false

jobs:
  reporte:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NFL_SIN_NAVEGADOR: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Traer la base de datos y el historial (rama datos)
        run: |
          if git ls-remote --exit-code --heads origin datos >/dev/null 2>&1; then
            git fetch --depth=1 origin datos
            git archive FETCH_HEAD | tar -x -C .
            echo "Base de datos restaurada."
          else
            echo "Primera vez: no hay base de datos guardada; se descargara todo de nflverse (tarda unos minutos)."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar paquetes
        run: pip install -r requirements.txt

      - name: Correr el modelo
        run: python semana_nfl.py

      - name: Avisar al celular de posibles valores nuevos (Telegram / ntfy; no hace nada si no los configuraste)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python avisos.py

      - name: Guardar la base de datos para la siguiente corrida
        run: |
          rm -rf /tmp/datos && mkdir -p /tmp/datos
          cp -r data /tmp/datos/data
          rm -f /tmp/datos/data/_pbp_*.csv.gz
          [ -d historial ] && cp -r historial /tmp/datos/historial || true
          cd /tmp/datos
          git init -q -b datos
          git add -A
          git -c user.name="reporte-nfl" -c user.email="reporte-nfl@users.noreply.github.com" commit -q -m "datos $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  # La publicacion va en su propio trabajo: si GitHub falla al publicar (error intermitente
  # "No artifacts named github-pages"), se reintenta sola y tambien se puede reintentar
  # con "Re-run failed jobs" sin volver a correr el modelo.
  publicar:
    needs: reporte
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar antes de reintentar la publicacion
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
